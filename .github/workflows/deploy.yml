name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without pushing a commit.
  workflow_dispatch:

# Grants this workflow just enough access to publish to Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; a new push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
